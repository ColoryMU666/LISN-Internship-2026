<!DOCTYPE html>
<html>
    <head>
        <title>
            Link generator
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="page-shell">
            <section class="card">
                <h1>Link generator</h1>
                <p class="description">Generate a launcher URL from a Git repository, optional branch, and optional file path.</p>

                <div class="output-section">
                    <div class="output-panel">
                        <div class="output-label">Generated URL</div>
                        <pre id="log" aria-live="polite">URL will appear here</pre>
                    </div>
                    <button id="copylogbtn" type="button">Copy URL</button>
                </div>

                <form class="link-form" onsubmit="return false;" autocomplete="off">
                    <div class="repo-group">
                        <label for="git_env_url">Git Environment Repository URL</label>
                    <div class="validated-input" aria-live="polite">
                        <input id="git_env_url" name="git_env_url" placeholder="https://github.com/example/test" required>
                    </div>

                        <label for="git_env_branch">Environment repository branch</label>
                            <div class="validated-input">
                                <input id="git_env_branch" name="git_env_branch" placeholder="main" value="main">
                            </div>
                        <div class="branch-note">use <span class="branch-highlight">master</span> instead of <span class="branch-highlight">main</span> for old repositories</div>
                    </div>

                    <div class="repo-group">
                        <label for="git_url">Git Content Repository URL</label>
                        <div class="validated-input">
                            <input id="git_url" name="git_url" placeholder="https://github.com/example/test">
                        </div>

                        <label for="git_branch">Content repository branch</label>
                        <div class="validated-input">
                            <input id="git_branch" name="git_branch" placeholder="main" value="main">
                        </div>
                        <div class="branch-note">use <span class="branch-highlight">master</span> instead of <span class="branch-highlight">main</span> for old repositories</div>
                    </div>

                    <label for="file">File to open (optional)</label>
                    <div class="validated-input">
                        <input id="file" name="file" placeholder="File to open after checkout">
                    </div>
                </form>
            </section>
        </main>
        <!-- To test with TypeScript, compile script.ts to script.js and use the generated file. -->
        <!-- <script type="module" src="script.ts"></script> -->
        <script type="text/javascript" src="script.js"></script>
    </body>
</html>
