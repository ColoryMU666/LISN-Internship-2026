<!DOCTYPE html>
<html>
    <head>
        <title>
            Link generator
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>
            Link generator
        </h1>
        <input placeholder="Enter git url" name="git_url">
        <input placeholder="Select branch" name="branch">
        <div class="invite-section">
            <label><input type="checkbox" id="inviteToggle"> Create an invitation link</label>
            <input id="inviteInput" name="invite_base" placeholder="Enter invitation base URL (e.g. https://mydocker.universite-paris-saclay.fr/shell/join/xxx)" style="display:none">
        </div>
        <label id="log" aria-live="polite">URL will appear here</label>
        <button id="copylogbtn" type="button">Copy</button>
        <script type="text/javascript" src="script.js"></script>
    </body>
</html>
